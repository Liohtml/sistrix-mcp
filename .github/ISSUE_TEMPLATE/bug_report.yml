name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: input
    id: sistrix-package
    attributes:
      label: SISTRIX package
      placeholder: "Plus / Professional / Premium"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run sistrix-mcp?
      options:
        - Prebuilt binary
        - cargo install
        - Docker
        - Built from source
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "Claude Code / Claude Desktop / Cursor / ..."
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error output (redact your API key!).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
