name: Feature request
description: Suggest a new tool or improvement
labels: [enhancement]
body:
  - type: textarea
    id: question
    attributes:
      label: What question should the model be able to answer?
      description: >
        Tools here are curated around real SEO questions, e.g.
        "which keywords sit just off page 1 with the biggest potential?"
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Does sistrix_api cover it today?
      description: If yes, what makes a dedicated tool worth it?
