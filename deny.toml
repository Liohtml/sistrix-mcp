# Supply-chain policy. CI runs `cargo deny check` and fails on an unignored
# RustSec advisory (vulnerabilities always fail; unsound and unmaintained
# advisories fail for the whole graph).

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2026-0189", reason = "rmcp streamable-HTTP DNS rebinding. This server is stdio-only (features server + transport-io); server-side-http is not enabled, and the advisory states non-HTTP transports are unaffected. rmcp 1.4 is a breaking upgrade." },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[bans]
# Duplicate transitive versions (for example windows-sys) are warned about.
# Wildcard requirements fail the build.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
